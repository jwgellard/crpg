<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CRPG M6 authoring prototype (T102)</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: "Segoe UI", system-ui, sans-serif; font-size:13px; background:#1e1e2e; color:#e6e6f0; height:100vh; display:flex; flex-direction:column; }
  #app { display:grid; grid-template-rows: 32px 1fr 140px; flex:1; min-height:0; }
  #menubar { display:flex; align-items:center; gap:4px; padding:4px 8px; background:#2a2a3e; border-bottom:1px solid #444; }
  .menu-btn { background:#3a3a52; color:#e6e6f0; border:1px solid #555; padding:4px 10px; border-radius:4px; cursor:pointer; font-size:12px; }
  .menu-btn.play { background:#2e7d32; }
  .menu-btn.stop { background:#c62828; }
  #main { display:grid; grid-template-columns: 260px 1fr 280px 220px; overflow:hidden; }
  #explorer, #center, #right, #flowspanel { padding:8px; overflow:auto; border-right:1px solid #444; }
  #flowspanel { border-right:none; }
  .panel-title { font-weight:600; margin-bottom:6px; color:#9cdcfe; }
  .tree-node { padding:2px 4px; cursor:pointer; border-radius:3px; }
  .tree-node:hover { background:#33334d; }
  .tree-node.selected { background:#4a4a6a; }
  .tree-children { margin-left:14px; }
  .tree-row { display:flex; align-items:center; gap:4px; }
  .short { color:#aaa; font-size:11px; margin-left:4px; }
  .newbtn { font-size:10px; padding:1px 6px; margin-left:6px; background:#3a3a52; border:1px solid #555; color:#e6e6f0; border-radius:3px; cursor:pointer; }
  #tabs { display:flex; gap:4px; padding:4px 0; border-bottom:1px solid #444; flex-wrap:wrap; }
  .tab { padding:4px 10px; background:#3a3a52; border:1px solid #555; border-radius:4px 4px 0 0; cursor:pointer; font-size:12px; }
  .tab.active { background:#1e1e2e; border-bottom-color:#1e1e2e; }
  #docarea { padding:8px; }
  .field { display:flex; gap:8px; margin:4px 0; }
  .field label { width:120px; color:#9cdcfe; }
  .field input { flex:1; background:#2a2a3e; border:1px solid #555; color:#e6e6f0; padding:2px 4px; }
  .section { margin-top:10px; }
  .section h4 { margin:4px 0; color:#c586c0; }
  #bottom { border-top:1px solid #444; padding:8px; overflow:auto; background:#252536; }
  .prob { padding:3px 0; border-bottom:1px solid #333; }
  .prob .fix { margin-left:8px; background:#3a3a52; border:1px solid #555; color:#e6e6f0; padding:1px 6px; border-radius:3px; cursor:pointer; font-size:11px; }
  .playview { padding:12px; background:#0f0f1a; border:1px solid #444; border-radius:6px; }
  /* Walkthrough banner: docked above the editor (not over it). It grows with its text up to a limit, then scrolls. */
  #walkbanner { display:none; flex:none; min-height:190px; max-height:min(46vh, 340px); overflow:auto; padding:10px 14px 12px; background:#fff1b8; color:#1a1a1a; border-bottom:3px solid #ffca28; font-size:14px; line-height:1.45; }
  #walkbanner .wt-head { display:flex; flex-wrap:wrap; align-items:center; gap:6px 12px; margin-bottom:8px; }
  #walkbanner .wt-flow { font-weight:700; font-size:15px; }
  #walkbanner .wt-count { background:#1a1a1a; color:#ffca28; border-radius:10px; padding:1px 10px; font-weight:600; font-size:12px; }
  #walkbanner .btns { margin-left:auto; display:flex; gap:6px; }
  #walkbanner button { background:#1a1a1a; color:#ffca28; border:1px solid #1a1a1a; padding:4px 12px; border-radius:4px; cursor:pointer; font-size:13px; }
  #walkbanner button:disabled { opacity:0.45; cursor:default; }
  #walkbanner .wt-body { display:grid; grid-template-columns:minmax(0,3fr) minmax(0,2fr); gap:0 28px; }
  @media (max-width: 900px) { #walkbanner .wt-body { grid-template-columns:1fr; } }
  #walkbanner .wt-block { margin:0 0 7px; }
  #walkbanner .wt-label { display:block; font-size:11px; font-weight:700; letter-spacing:0.05em; text-transform:uppercase; color:#6b4e00; }
  #walkbanner .wt-click { background:#ffffff; border-left:5px solid #ffca28; padding:4px 8px; border-radius:3px; font-weight:600; }
  #walkbanner .wt-mock { font-style:italic; }
  #walkbanner .wt-term { margin:0 0 4px; font-size:13px; }
  #walkbanner .wt-help { font-size:13px; color:#4a3a00; }
  #walkbanner .wt-hint { min-height:1.2em; color:#9b1c1c; font-weight:600; }
  @media (prefers-color-scheme: dark) {
    #walkbanner { background:#2b2410; color:#f6f0da; }
    #walkbanner .wt-count { background:#ffca28; color:#1a1a1a; }
    #walkbanner button { background:#ffca28; color:#1a1a1a; border-color:#ffca28; }
    #walkbanner .wt-label { color:#ffd966; }
    #walkbanner .wt-click { background:#3d3312; }
    #walkbanner .wt-help { color:#e0d4a0; }
    #walkbanner .wt-hint { color:#ff9b9b; }
  }
  .wt-highlight { outline:3px solid #ffca28 !important; box-shadow:0 0 8px #ffca28; }
  .flowhint { color:#aaa; font-size:12px; margin-bottom:8px; }
  .flowitem { padding:4px; cursor:pointer; border-radius:3px; }
  .flowitem:hover { background:#33334d; }
  .flowitem.active { background:#4a4a6a; }
  .modal { position:fixed; inset:0; background:rgba(0,0,0,0.6); display:none; align-items:center; justify-content:center; z-index:900; }
  .modal .box { background:#2a2a3e; padding:16px; border-radius:8px; max-width:400px; width:90%; }
  .modal .box button { margin-top:8px; }
  .dropdown { position:absolute; background:#2a2a3e; border:1px solid #555; padding:4px; border-radius:4px; z-index:500; display:none; }
  .dropdown .item { padding:4px 10px; cursor:pointer; }
  .dropdown .item:hover { background:#3a3a52; }
</style>
</head>
<body>
<div id="walkbanner" role="region" aria-label="Guided walkthrough"></div>
<div id="app">
  <div id="menubar">
    <button class="menu-btn" id="menu-campaign" data-wt="menu-campaign">Campaign ▾</button>
    <button class="menu-btn" id="menu-edit" data-wt="menu-edit">Edit ▾</button>
    <button class="menu-btn" id="menu-world" data-wt="menu-world">World ▾</button>
    <button class="menu-btn" id="menu-rules" data-wt="menu-rules">Rules ▾</button>
    <button class="menu-btn" id="menu-test" data-wt="menu-test">Test ▾</button>
    <button class="menu-btn" id="menu-package" data-wt="menu-package">Package ▾</button>
    <button class="menu-btn play" id="btn-play" data-wt="play-button">▶ Play</button>
    <button class="menu-btn stop" id="btn-stop" data-wt="stop-button">⏹</button>
    <button class="menu-btn" id="btn-flows" data-wt="flows-toggle">Flows</button>
  </div>
  <div id="main">
    <div id="explorer"><div class="panel-title">CAMPAIGN</div><div id="explorer-tree"></div></div>
    <div id="center">
      <div id="tabs"></div>
      <div id="docarea" data-wt="panel-doc"></div>
    </div>
    <div id="right">
      <div class="panel-title">PROPERTIES</div><div id="properties" data-wt="panel-properties"></div>
      <div class="section" data-wt="panel-references"><h4>REFERENCES</h4><div id="references"></div></div>
    </div>
    <div id="flowspanel">
      <div class="panel-title">Flows</div>
      <div class="flowhint">Click a flow to start a guided walkthrough. Each one begins with a short introduction.</div>
      <div id="flowlist"></div>
    </div>
  </div>
  <div id="bottom">
    <div class="panel-title">PROBLEMS</div>
    <div id="problems"></div>
  </div>
</div>

<!-- dropdowns -->
<div id="dd-campaign" class="dropdown">
  <div class="item" data-wt="menu-campaign-new" data-action="new-campaign">New campaign…</div>
  <div class="item" data-wt="menu-campaign-applyplan" data-action="apply-plan">Apply plan…</div>
</div>
<div id="dd-world" class="dropdown">
  <div class="item" data-wt="menu-world-newarea" data-action="new-area">New area</div>
</div>
<div id="dd-rules" class="dropdown">
  <div class="item" data-wt="menu-rules-newfromtemplate" data-action="new-rules-from-template">New rules from template…</div>
  <div class="item" data-wt="menu-rules-change" data-action="change-rules">Change for this campaign…</div>
</div>

<div id="modal" class="modal"><div class="box" id="modalbox"></div></div>

<script>
// ---------- State ----------
function baseEmpty(){
  return {campaign:false,campaignName:'',ruleset:'',explorer:[],tabs:[],activeTab:null,
    selected:null,selectedObject:null,problems:[],playMode:false,playView:'',
    terrainBaked:false,walkableOverlay:false,dialogueText:false,rulesOverride:false,
    importedAsset:false,planApplied:false,assets:[]};
}
function campaignExplorer(opts){
  opts=opts||{};
  var creatures = opts.creatures||[{id:'creature:hero',label:'Hero',short:'hero'}];
  var items = opts.items||[];
  var props = opts.props||[{id:'prop:tree',label:'Tree',short:'tree'}];
  var dialogue = opts.dialogue||[];
  var quests = opts.quests||[];
  var fights = opts.fights||[];
  var events = opts.events||[];
  var factions = opts.factions||[];
  var assets = opts.assets||[];
  return [
    {id:'g-worlds',label:'Worlds',expanded:true,children:[
      {id:'world:main',label:'World',short:'world',expanded:true,children:[
        {id:'area:start',label:'Start',short:'start',newAction:'new-area'}
      ],newAction:'new-world'}
    ]},
    {id:'g-creatures',label:'Creatures',expanded:true,children:creatures,newAction:'new-creature'},
    {id:'g-items',label:'Items',expanded:true,children:items,newAction:'new-item'},
    {id:'g-props',label:'Props',expanded:true,children:props},
    {id:'g-dialogue',label:'Dialogue',expanded:true,children:dialogue,newAction:'new-dialogue'},
    {id:'g-quests',label:'Quests',expanded:true,children:quests,newAction:'new-quest'},
    {id:'g-fights',label:'Fights',expanded:true,children:fights,newAction:'new-fight'},
    {id:'g-events',label:'Events',expanded:true,children:events,newAction:'new-event'},
    {id:'g-factions',label:'Factions',expanded:true,children:factions,newAction:'new-faction'},
    {id:'g-rules',label:'Rules',expanded:true,children:[
      {id:'ruleset:minimal-d6',label:'minimal-d6',short:'minimal-d6',expanded:true,children:[
        {id:'rule:strike',label:'Strike',short:'strike'}
      ],newAction:'new-rules-from-template'}
    ]},
    {id:'g-assets',label:'Assets',expanded:true,children:assets,newAction:'import-asset'},
    {id:'g-text',label:'Text',expanded:true,children:[{id:'text:en',label:'en',short:'en'}]},
  ];
}
function baseCampaign(overrides){
  var v = baseEmpty();
  v.campaign=true; v.campaignName='My Campaign'; v.ruleset='minimal-d6';
  v.explorer=campaignExplorer();
  v.tabs=['area:start']; v.activeTab='area:start'; v.selected='area:start';
  v.selectedObject={name:'Start',short:'start',fields:[{label:'Name',value:'Start'},{label:'Terrain',value:'flat'}],refs:{uses:[],usedBy:['Hero (placement)']}};
  v.problems=[];
  if(overrides) Object.assign(v,overrides);
  return v;
}

// ---------- Screens (full states) ----------
const SCREENS = {};
SCREENS['empty'] = baseEmpty();
SCREENS['campaign-created'] = baseCampaign();
SCREENS['area-newtab'] = baseCampaign({tabs:['area:start','area:new'],activeTab:'area:new',selected:'area:new',
  selectedObject:{name:'New area',short:'new-area',fields:[{label:'Name',value:'New area'},{label:'Terrain',value:'flat'}],refs:{uses:[],usedBy:[]}},
  explorer:campaignExplorer({})});
// add area node
SCREENS['area-newtab'].explorer[0].children[0].children.push({id:'area:new',label:'New area',short:'new-area',newAction:'new-area'});

SCREENS['area-withprops'] = baseCampaign({terrainBaked:false,walkableOverlay:false,
  tabs:['area:start'],activeTab:'area:start',selected:'area:start',
  selectedObject:{name:'Start',short:'start',fields:[{label:'Name',value:'Start'},{label:'Terrain',value:'flat'},{label:'Placements',value:'Tree, Hero'}],refs:{uses:['Tree','Hero'],usedBy:[]}},
  explorer:campaignExplorer({props:[{id:'prop:tree',label:'Tree',short:'tree'},{id:'prop:rock',label:'Rock',short:'rock'}]})});

SCREENS['creatures-created'] = baseCampaign({
  explorer:campaignExplorer({creatures:[{id:'creature:hero',label:'Hero',short:'hero'},{id:'creature:elder',label:'Elder',short:'elder'},{id:'creature:goblin',label:'Goblin',short:'goblin'}]}),
  selected:'creature:goblin', activeTab:'creature:goblin', tabs:['creature:goblin'],
  selectedObject:{name:'Goblin',short:'goblin',fields:[{label:'Might',value:'4'},{label:'Health',value:'6'},{label:'Rules',value:'minimal-d6 (campaign)'}],refs:{uses:[],usedBy:[]}}});

SCREENS['creature-stats'] = baseCampaign({
  explorer:campaignExplorer({creatures:[{id:'creature:hero',label:'Hero',short:'hero'},{id:'creature:elder',label:'Elder',short:'elder'},{id:'creature:goblin',label:'Goblin',short:'goblin'}]}),
  selected:'creature:goblin', activeTab:'creature:goblin', tabs:['creature:goblin'],
  selectedObject:{name:'Goblin',short:'goblin',fields:[{label:'Might',value:'4'},{label:'Health',value:'6'},{label:'Strike damage',value:'2d6'},{label:'Roll table',value:'2d6'}],refs:{uses:['minimal-d6'],usedBy:[]}}});

SCREENS['dialogue-new'] = baseCampaign({
  explorer:campaignExplorer({dialogue:[{id:'dialogue:elder',label:'Elder talk',short:'elder-talk'}],creatures:[{id:'creature:hero',label:'Hero',short:'hero'},{id:'creature:elder',label:'Elder',short:'elder'},{id:'creature:goblin',label:'Goblin',short:'goblin'}]}),
  tabs:['dialogue:elder-talk'],activeTab:'dialogue:elder-talk',selected:'dialogue:elder-talk',
  selectedObject:{name:'Elder talk',short:'elder-talk',fields:[{label:'Speaker',value:'Elder'},{label:'Nodes',value:'entry, choice, end'}],refs:{uses:['Elder'],usedBy:[]}},
  dialogueText:false});

SCREENS['dialogue-texttoggle'] = baseCampaign({
  explorer:campaignExplorer({dialogue:[{id:'dialogue:elder',label:'Elder talk',short:'elder-talk'}],creatures:[{id:'creature:hero',label:'Hero',short:'hero'},{id:'creature:elder',label:'Elder',short:'elder'},{id:'creature:goblin',label:'Goblin',short:'goblin'}]}),
  tabs:['dialogue:elder-talk'],activeTab:'dialogue:elder-talk',selected:'dialogue:elder-talk',
  selectedObject:{name:'Elder talk',short:'elder-talk',fields:[{label:'View',value:'indented text'},{label:'entry: Elder: "Hello"',value:''},{label:'  choice: "Help?" -> quest Main',value:''},{label:'  end',value:''}],refs:{uses:[],usedBy:[]}},
  dialogueText:true});

SCREENS['quest-new'] = baseCampaign({
  explorer:campaignExplorer({quests:[{id:'quest:main',label:'Main',short:'main'}],creatures:[{id:'creature:hero',label:'Hero',short:'hero'},{id:'creature:elder',label:'Elder',short:'elder'},{id:'creature:goblin',label:'Goblin',short:'goblin'}]}),
  tabs:['quest:main'],activeTab:'quest:main',selected:'quest:main',
  selectedObject:{name:'Main',short:'main',fields:[{label:'States',value:'Started, Completed'},{label:'Entry',value:'Started'},{label:'Completed when',value:'Goblin dies'}],refs:{uses:['Goblin'],usedBy:[]}}});

SCREENS['event-page'] = baseCampaign({
  explorer:campaignExplorer({events:[{id:'event:goblin-death',label:'Goblin dies',short:'goblin-death'}],quests:[{id:'quest:main',label:'Main',short:'main'}],creatures:[{id:'creature:hero',label:'Hero',short:'hero'},{id:'creature:elder',label:'Elder',short:'elder'},{id:'creature:goblin',label:'Goblin',short:'goblin'}]}),
  tabs:['event:goblin-death'],activeTab:'event:goblin-death',selected:'event:goblin-death',
  selectedObject:{name:'Goblin dies',short:'goblin-death',fields:[{label:'When',value:'Goblin dies'},{label:'If',value:'(none)'},{label:'Do',value:'set quest Main to Completed'}],refs:{uses:['Goblin','Main'],usedBy:[]}}});

SCREENS['play-start'] = baseCampaign({playMode:true,playView:'Play view — area Start. Player start: Hero. Problems banner: (none).'});
SCREENS['play-navigate'] = baseCampaign({playMode:true,walkableOverlay:true,playView:'Play view — area Start. Walkable overlay ON. Click ground to move Hero.'});
SCREENS['play-talk'] = baseCampaign({playMode:true,playView:'Play view — talking to Elder. Choice: "Help?" -> starts quest Main. Journal: Main: Started.'});
SCREENS['play-fight'] = baseCampaign({playMode:true,playView:'Play view — fight: Hero vs Goblin. Combat log: Hero rolls 2d6… Goblin dies.'});
SCREENS['play-questcomplete'] = baseCampaign({playMode:true,playView:'Play view — journal: Main: Completed (Goblin died).'});
SCREENS['play-save'] = baseCampaign({playMode:true,playView:'Play view — saved game state. Stop, then Play → Load restores quest state and positions.'});
SCREENS['play-two-clients'] = baseCampaign({playMode:false,playView:'',problems:[],selectedObject:{name:'Server',short:'server',fields:[{label:'Mode',value:'two clients connected'},{label:'Status',value:'both show same world'}],refs:{uses:[],usedBy:[]}}});

SCREENS['terrain-baked'] = baseCampaign({terrainBaked:true,walkableOverlay:true,
  selectedObject:{name:'Start',short:'start',fields:[{label:'Terrain',value:'baked'},{label:'Walkable overlay',value:'ON'}],refs:{uses:[],usedBy:[]}}});

SCREENS['references-area'] = baseCampaign({
  explorer:campaignExplorer({creatures:[{id:'creature:hero',label:'Hero',short:'hero'},{id:'creature:elder',label:'Elder',short:'elder'},{id:'creature:goblin',label:'Goblin',short:'goblin'}]}),
  selected:'area:start',activeTab:'area:start',tabs:['area:start'],
  selectedObject:{name:'Start',short:'start',fields:[{label:'Name',value:'Start'}],refs:{uses:['Hero (placement)','Elder (placement)','Goblin (placement)'],usedBy:[]}}});

SCREENS['rules-new'] = baseCampaign({rulesOverride:false,
  explorer:campaignExplorer({}),
  tabs:['ruleset:new-rules'],activeTab:'ruleset:new-rules',selected:'ruleset:new-rules',
  selectedObject:{name:'New rules',short:'new-rules',fields:[{label:'Origin',value:'minimal-d6'},{label:'Stats',value:'might, health (+new stat)'},{label:'Roll table',value:'edited row'},{label:'Strike damage',value:'edited'}],refs:{uses:[],usedBy:[]}}});

SCREENS['rules-override'] = baseCampaign({rulesOverride:true,
  selected:'ruleset:minimal-d6',activeTab:'ruleset:minimal-d6',tabs:['ruleset:minimal-d6'],
  selectedObject:{name:'minimal-d6',short:'minimal-d6',fields:[{label:'Override',value:'stored for this campaign'},{label:'Template files',value:'unchanged'}],refs:{uses:[],usedBy:[]}}});

SCREENS['asset-import'] = baseCampaign({importedAsset:true,
  explorer:campaignExplorer({assets:[{id:'asset:goblin-model',label:'goblin.glb',short:'goblin-model'}],creatures:[{id:'creature:hero',label:'Hero',short:'hero'},{id:'creature:elder',label:'Elder',short:'elder'},{id:'creature:goblin',label:'Goblin',short:'goblin'}]}),
  tabs:['creature:goblin'],activeTab:'creature:goblin',selected:'creature:goblin',
  selectedObject:{name:'Goblin',short:'goblin',fields:[{label:'Appearance',value:'goblin-model (model)'},{label:'Might',value:'4'}],refs:{uses:['goblin-model'],usedBy:[]}},
  problems:[]});

SCREENS['asset-import-check'] = baseCampaign({
  explorer:campaignExplorer({assets:[],creatures:[{id:'creature:hero',label:'Hero',short:'hero'},{id:'creature:elder',label:'Elder',short:'elder'},{id:'creature:goblin',label:'Goblin',short:'goblin'}]}),
  tabs:['asset:import'],activeTab:'asset:import',selected:'g-assets',
  selectedObject:{name:'Import asset',short:'import',fields:[{label:'File',value:'goblin.glb'},{label:'Class',value:'Model'},{label:'Checks',value:'glTF 2.0 OK; rig conforms'}],refs:{uses:[],usedBy:[]}},
  problems:[]});

SCREENS['plan-applied'] = baseCampaign({planApplied:true,
  problems:[],
  selectedObject:{name:'Campaign',short:'campaign',fields:[{label:'Plan applied',value:'3 changed objects'},{label:'Undo',value:'reverts all'}],refs:{uses:[],usedBy:[]}}});

// ---------- View state ----------
var view = JSON.parse(JSON.stringify(SCREENS['empty']));
var walkthrough = null; // {flowId, stepIndex}

// ---------- Render ----------
function el(id){return document.getElementById(id);}
function renderExplorer(){
  var root=el('explorer-tree'); root.innerHTML='';
  function node(n,depth){
    var div=document.createElement('div');
    div.className='tree-node'+(view.selected===n.id?' selected':'');
    div.setAttribute('data-wt', n.id);
    var row=document.createElement('div'); row.className='tree-row';
    var label=document.createElement('span'); label.textContent=n.label; row.appendChild(label);
    if(n.short){var s=document.createElement('span'); s.className='short'; s.textContent=n.short; row.appendChild(s);}
    if(n.newAction){var b=document.createElement('button'); b.className='newbtn'; b.textContent='New…'; b.setAttribute('data-action',n.newAction); b.setAttribute('data-wt','new-'+n.newAction); row.appendChild(b);}
    div.appendChild(row);
    div.addEventListener('click',function(e){
      if(e.target && e.target.getAttribute && e.target.getAttribute('data-action')) return;
      view.selected=n.id; renderAll();
    });
    root.appendChild(div);
    if(n.children && n.expanded){
      var c=document.createElement('div'); c.className='tree-children';
      // move children rendering into c
      var holder=root; 
      // render children into a temp then append
      var prev=root;
      // We'll just recurse appending to root then indent via margin? Use nested container.
    }
    if(n.children && n.expanded){
      var container=document.createElement('div'); container.style.marginLeft='14px';
      // render children recursively into container
      n.children.forEach(function(ch){ renderNodeInto(ch,container); });
      root.appendChild(container);
    }
  }
  function renderNodeInto(n,container){
    var div=document.createElement('div');
    div.className='tree-node'+(view.selected===n.id?' selected':'');
    div.setAttribute('data-wt', n.id);
    var row=document.createElement('div'); row.className='tree-row';
    var label=document.createElement('span'); label.textContent=n.label; row.appendChild(label);
    if(n.short){var s=document.createElement('span'); s.className='short'; s.textContent=n.short; row.appendChild(s);}
    if(n.newAction){var b=document.createElement('button'); b.className='newbtn'; b.textContent='New…'; b.setAttribute('data-action',n.newAction); b.setAttribute('data-wt','new-'+n.newAction); row.appendChild(b);}
    div.appendChild(row);
    div.addEventListener('click',function(e){
      if(e.target && e.target.getAttribute && e.target.getAttribute('data-action')) return;
      view.selected=n.id; renderAll();
    });
    container.appendChild(div);
    if(n.children && n.expanded){
      var sub=document.createElement('div'); sub.style.marginLeft='14px';
      n.children.forEach(function(ch){ renderNodeInto(ch,sub); });
      container.appendChild(sub);
    }
  }
  view.explorer.forEach(function(n){ node(n,0); });
}
function renderTabs(){
  var root=el('tabs'); root.innerHTML='';
  (view.tabs||[]).forEach(function(t){
    var lbl=t.split(':').pop().replace(/-/g,' ');
    lbl=lbl.charAt(0).toUpperCase()+lbl.slice(1);
    var d=document.createElement('div'); d.className='tab'+(view.activeTab===t?' active':''); d.textContent=lbl; d.setAttribute('data-wt','tab:'+t);
    d.addEventListener('click',function(){ view.activeTab=t; renderAll(); });
    root.appendChild(d);
  });
}
function renderDoc(){
  var root=el('docarea'); root.innerHTML='';
  if(view.playMode){
    var pv=document.createElement('div'); pv.className='playview'; pv.textContent=view.playView; pv.setAttribute('data-wt','play-view'); root.appendChild(pv);
    return;
  }
  if(!view.campaign){
    root.innerHTML='<p>No campaign open. Use Campaign ▸ New campaign…</p>'; return;
  }
  var so=view.selectedObject;
  if(so){
    var h=document.createElement('h3'); h.textContent=so.name+'  '; var sh=document.createElement('span'); sh.className='short'; sh.textContent=so.short; h.appendChild(sh); root.appendChild(h);
    (so.fields||[]).forEach(function(f){
      var row=document.createElement('div'); row.className='field';
      var lab=document.createElement('label'); lab.textContent=f.label;
      var inp=document.createElement('input'); inp.value=f.value; inp.readOnly=true;
      row.appendChild(lab); row.appendChild(inp); root.appendChild(row);
    });
  } else {
    root.innerHTML='<p>Select an object.</p>';
  }
}
function renderRight(){
  var p=el('properties'); p.innerHTML='';
  var so=view.selectedObject;
  if(so){
    (so.fields||[]).forEach(function(f){
      var row=document.createElement('div'); row.className='field';
      var lab=document.createElement('label'); lab.textContent=f.label;
      var inp=document.createElement('input'); inp.value=f.value;
      row.appendChild(lab); row.appendChild(inp); p.appendChild(row);
    });
  }
  var r=el('references'); r.innerHTML='';
  var so2=view.selectedObject;
  if(so2 && so2.refs){
    var u=document.createElement('div'); u.innerHTML='<b>Uses</b>: '+(so2.refs.uses||[]).join(', '); r.appendChild(u);
    var b=document.createElement('div'); b.innerHTML='<b>Used by</b>: '+(so2.refs.usedBy||[]).join(', '); r.appendChild(b);
  }
}
function renderProblems(){
  var root=el('problems'); root.innerHTML='';
  (view.problems||[]).forEach(function(pr){
    var div=document.createElement('div'); div.className='prob';
    div.textContent=pr.severity+' — '+pr.object+' — '+pr.field+' — '+pr.message;
    if(pr.fix){var b=document.createElement('button'); b.className='fix'; b.textContent='Fix'; b.setAttribute('data-wt','fix-'+pr.code); b.addEventListener('click',function(){}); div.appendChild(b);}
    root.appendChild(div);
  });
  if((view.problems||[]).length===0) root.innerHTML='<em>Problems empty</em>';
}
function renderAll(){
  renderExplorer(); renderTabs(); renderDoc(); renderRight(); renderProblems();
  applyHighlight();
}

// ---------- Actions ----------
function doAction(action){
  switch(action){
    case 'new-campaign':
      view = JSON.parse(JSON.stringify(SCREENS['campaign-created']));
      break;
    case 'new-area':
      view = JSON.parse(JSON.stringify(SCREENS['area-newtab']));
      break;
    case 'new-creature':
      // add creature placeholder handled in flow screen
      view = JSON.parse(JSON.stringify(SCREENS['creatures-created']));
      break;
    case 'new-dialogue':
      view = JSON.parse(JSON.stringify(SCREENS['dialogue-new']));
      break;
    case 'new-quest':
      view = JSON.parse(JSON.stringify(SCREENS['quest-new']));
      break;
    case 'new-fight':
      view = JSON.parse(JSON.stringify(SCREENS['play-fight']));
      break;
    case 'new-event':
      view = JSON.parse(JSON.stringify(SCREENS['event-page']));
      break;
    case 'new-rules-from-template':
      view = JSON.parse(JSON.stringify(SCREENS['rules-new']));
      break;
    case 'change-rules':
      view = JSON.parse(JSON.stringify(SCREENS['rules-override']));
      break;
    case 'import-asset':
      view = JSON.parse(JSON.stringify(SCREENS['asset-import-check']));
      break;
    case 'apply-plan':
      view = JSON.parse(JSON.stringify(SCREENS['plan-applied']));
      break;
    case 'bake-nav':
      view = JSON.parse(JSON.stringify(SCREENS['terrain-baked']));
      break;
  }
  renderAll();
}

// ---------- Banner text ----------
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmt(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>'); }
function clickText(step){
  return step.click + (step.kind==='look' ? ' Click the outlined box, or press **Next**, to go on.' : '');
}
// Plain text of everything the banner shows at position i (-1 = introduction, n = end card), except definitions.
function bannerPlain(f,i){
  var n=f.steps.length, parts=[];
  if(i<0){ parts.push(f.title,f.intro); }
  else if(i<n){
    var s=f.steps[i];
    if(i>0) parts.push(f.steps[i-1].after);
    parts.push(s.why,clickText(s)); if(s.mock) parts.push(s.mock);
  } else { parts.push(f.steps[n-1].after,f.see,f.ask); }
  return parts.join(' \n ').replace(/\*\*/g,'');
}
// Terms that appear here for the first time in this flow, so each is explained once.
function termsFor(f,i){
  var seen={}, k;
  for(k=-1;k<i;k++){ var t=bannerPlain(f,k); GLOSS.forEach(function(g){ if(g.re.test(t)) seen[g.key]=true; }); }
  var cur=bannerPlain(f,i);
  return GLOSS.filter(function(g){ return g.re.test(cur) && !seen[g.key]; });
}

// ---------- Walkthrough control ----------
var DD_OWNER={'dd-campaign':'menu-campaign','dd-world':'menu-world','dd-rules':'menu-rules'};
function cloneScreen(name){ return JSON.parse(JSON.stringify(SCREENS[name])); }
function startFlow(id){
  var f=FLOWS.find(function(x){return x.id===id;});
  if(!f) return;
  walkthrough={flowId:id,stepIndex:-1};
  applyStep();
}
function currentFlow(){ return walkthrough? FLOWS.find(function(x){return x.id===walkthrough.flowId;}):null; }
function applyStep(){
  var f=currentFlow(); if(!f) return;
  var i=walkthrough.stepIndex, n=f.steps.length;
  var screen = i<0 ? f.steps[0].screen : (i>=n ? f.endScreen : f.steps[i].screen);
  view=cloneScreen(screen);
  closeAllDd();
  renderAll(); renderFlows();
  showBanner(f,i);
  if(i>=0 && i<n) openDdForTarget(f.steps[i].target);
  applyHighlight();
}
// A step whose target sits in a drop-down menu needs that menu open, or the gold outline would be invisible.
function openDdForTarget(token){
  var item=document.querySelector('.dropdown [data-wt="'+token+'"]');
  if(!item) return;
  var dd=item.closest('.dropdown');
  toggleDd(dd.id, el(DD_OWNER[dd.id]));
}
function showBanner(f,i){
  var n=f.steps.length, b=el('walkbanner'), h='', left='', right='';
  var badge = i<0 ? 'Introduction' : (i<n ? 'Step '+(i+1)+' of '+n : 'Finished');
  function block(label,cls,text){ return '<div class="wt-block"><span class="wt-label">'+label+'</span><span class="'+(cls||'')+'">'+fmt(text)+'</span></div>'; }
  if(i<0){
    left += block('What you will do','',f.intro);
    left += '<div class="wt-help">Each step tells you what you are doing and why, then what to click. Click the item outlined in gold. Press Next if you would rather skip a click.</div>';
  } else if(i<n){
    var s=f.steps[i];
    if(i>0) left += block('Just happened','',f.steps[i-1].after);
    left += block('What you are doing and why','',s.why);
    left += block(s.kind==='look'?'What to look at':'What to click','wt-click',clickText(s));
    if(s.mock) right += block('About the mock','wt-mock',s.mock);
  } else {
    left += block('Just happened','',f.steps[n-1].after);
    left += block('What you should now see','',f.see);
    left += block('Question for you','',f.ask);
  }
  var terms=termsFor(f,i);
  if(terms.length){
    right += '<div class="wt-block"><span class="wt-label">What\'s this?</span>'+terms.map(function(g){ return '<div class="wt-term"><strong>'+esc(g.name)+'</strong>: '+esc(g.text)+'</div>'; }).join('')+'</div>';
  }
  var hasNextFlow = FLOWS.indexOf(f) < FLOWS.length-1;
  h += '<div class="wt-head"><span class="wt-flow">'+esc(f.id)+' · '+esc(f.title)+'</span><span class="wt-count">'+badge+'</span>';
  h += '<div class="btns"><button id="wt-back"'+(i<0?' disabled':'')+'>Back</button>';
  if(i<n) h += '<button id="wt-next">'+(i<0?'Start':'Next')+'</button>';
  else if(hasNextFlow) h += '<button id="wt-nextflow">Next flow</button>';
  h += '<button id="wt-restart">Restart</button><button id="wt-close">Close</button></div></div>';
  h += '<div class="wt-body"><div>'+left+'</div><div>'+right+'</div></div><div class="wt-hint" id="wt-hint" role="status"></div>';
  b.style.display='block';
  b.innerHTML=h; b.scrollTop=0;
  el('wt-back').addEventListener('click',backStep);
  if(el('wt-next')) el('wt-next').addEventListener('click',nextStep);
  if(el('wt-nextflow')) el('wt-nextflow').addEventListener('click',function(){ startFlow(FLOWS[FLOWS.indexOf(currentFlow())+1].id); });
  el('wt-restart').addEventListener('click',restartFlow);
  el('wt-close').addEventListener('click',closeWalk);
}
function setHint(msg){ var h=el('wt-hint'); if(h) h.textContent=msg; }
function backStep(){ if(walkthrough && walkthrough.stepIndex>-1){ walkthrough.stepIndex--; applyStep(); } }
function nextStep(){ if(walkthrough && walkthrough.stepIndex<currentFlow().steps.length){ walkthrough.stepIndex++; applyStep(); } }
function restartFlow(){ if(walkthrough){ walkthrough.stepIndex=-1; applyStep(); } }
function closeWalk(){
  walkthrough=null; el('walkbanner').style.display='none'; closeAllDd(); renderAll(); renderFlows();
}
// All data-wt values on the clicked element and the elements around it.
function tokensOf(node){
  var out=[];
  while(node && node.getAttribute){ var t=node.getAttribute('data-wt'); if(t) out.push(t); node=node.parentNode; }
  return out;
}
function isEditorControl(t){
  return !!(t.closest && t.closest('.menu-btn:not(#btn-flows), .dropdown .item, .newbtn, .tree-node, .tab, .fix'));
}
// Returns true when the click was consumed by the walkthrough (advanced, or answered with a hint).
function walkClick(e){
  var f=currentFlow(), i=walkthrough.stepIndex, n=f.steps.length, t=e.target;
  if(i>=0 && i<n && tokensOf(t).indexOf(f.steps[i].target)>=0){
    e.stopPropagation(); e.preventDefault();
    walkthrough.stepIndex++; applyStep();
    return true;
  }
  if(isEditorControl(t)){
    e.stopPropagation(); e.preventDefault();
    setHint(i<0 ? 'Read the introduction, then press Start.'
          : i>=n ? 'This flow is finished. Use Back, Restart, Next flow or Close.'
          : 'That is not the highlighted item. Click the one outlined in gold, or press Next to skip this step.');
    return true;
  }
  return false;
}
function applyHighlight(){
  document.querySelectorAll('.wt-highlight').forEach(function(e){e.classList.remove('wt-highlight');});
  if(!walkthrough) return;
  var f=currentFlow();
  if(!f || walkthrough.stepIndex<0 || walkthrough.stepIndex>=f.steps.length) return;
  var found=document.querySelectorAll('[data-wt="'+f.steps[walkthrough.stepIndex].target+'"]');
  found.forEach(function(e){e.classList.add('wt-highlight');});
  if(found.length && found[0].scrollIntoView) found[0].scrollIntoView({block:'nearest',inline:'nearest'});
}

// ---------- Event wiring ----------
document.addEventListener('click',function(e){
  var t=e.target;
  if(t && t.closest && t.closest('#walkbanner, #flowspanel')) return;
  if(walkthrough){
    walkClick(e);
    return; // while a walkthrough is open, only the highlighted step does anything
  }
  // Free exploration (no walkthrough open)
  if(t && t.id==='menu-campaign'){ toggleDd('dd-campaign',t); return;}
  if(t && t.id==='menu-world'){ toggleDd('dd-world',t); return;}
  if(t && t.id==='menu-rules'){ toggleDd('dd-rules',t); return;}
  if(t && t.getAttribute && t.getAttribute('data-action')){
    doAction(t.getAttribute('data-action'));
    closeAllDd();
    return;
  }
  if(t && t.id==='btn-play'){
    view.playMode=true;
    if(!view.playView) view.playView='Play view — area Start.';
    renderAll();
    return;
  }
  if(t && t.id==='btn-stop'){ view.playMode=false; renderAll(); return; }
  closeAllDd();
},true);

function toggleDd(id,anchor){
  closeAllDd();
  var d=el(id); d.style.display='block';
  var r=anchor.getBoundingClientRect();
  d.style.left=r.left+'px'; d.style.top=(r.bottom+2)+'px';
}
function closeAllDd(){ ['dd-campaign','dd-world','dd-rules'].forEach(function(i){ el(i).style.display='none';}); }

// flows list
function renderFlows(){
  var root=el('flowlist'); root.innerHTML='';
  FLOWS.forEach(function(f){
    var d=document.createElement('div'); d.className='flowitem'+(walkthrough&&walkthrough.flowId===f.id?' active':'');
    d.textContent=f.id+' '+f.title;
    d.addEventListener('click',function(){ startFlow(f.id); });
    root.appendChild(d);
  });
}

// init
renderFlows();
view = JSON.parse(JSON.stringify(SCREENS['empty']));
renderAll();
</script>
