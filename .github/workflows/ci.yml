name: ci
# Policy: fork PRs run on GitHub-hosted runners only; CI and lint changes from fork PRs are rejected by the guard job; the self-hosted runner never receives a pull_request-triggered job.
on:
  push:
    branches: [master]
  pull_request:
  # The advisory database moves without this repository moving. Without a
  # scheduled run, `cargo deny` only learns about a new RUSTSEC advisory in an
  # existing dependency the next time somebody pushes, which on a solo project
  # can be weeks. Weekly turns that into a notification.
  schedule:
    - cron: "0 6 * * 1"

# Action pins: the JavaScript actions below sit on moving major tags,
# so they pick up fixes without a bump here. They are on the majors that
# declare the node24 runtime -- GitHub is retiring node20, and an action
# still asking for it will stop starting when the compatibility shim goes.
# checkout v5+ requires a runner at v2.327.1 or newer, which matters only if
# the self-hosted runner in workflow plan section 15 ever lands.
# cargo-deny-action and gitleaks-action are the exceptions twice over: pinned
# exactly (see the comments on the deny and secrets jobs). A floating pin on
# either would change the enforced policy without a diff here.

# Self-hosted-runner rule (S001): the self-hosted runner executes only `push`
# on the base repo's own branches, or `workflow_dispatch`; no
# `pull_request`-triggered job may use a custom `runs-on:` label. Every job
# below runs on GitHub-hosted runners, so a fork PR can never reach
# self-hosted execution; a workflow change smuggling in a custom label is
# rejected by the guard job's protected-paths rule over
# `.github/workflows/**`. This is an enforced rule, not a configuration note.

# Read-only by default; no job here writes to the repository.
permissions:
  contents: read

# A new push to a branch supersedes the run already going on it. Master is
# exempt: those runs are the record of what actually landed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  guard:
    # Fork-PR tripwire + trusted-lint gate (S001). Plain git/bash and the
    # existing Python lint invocations only; no new third-party action.
    # There is no automation bypass for sub-check (b): the override for a
    # legitimate lint change is ordinary maintainer review and merge, never a
    # secret, variable, or comment convention. Fail closed is the point.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Protected paths (fork PRs may not touch lint or workflows)
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags origin "$BASE_SHA" --depth=1 || true
          MERGE_BASE="$(git merge-base HEAD "$BASE_SHA")"
          echo "merge-base: $MERGE_BASE"
          if [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
            echo "fork PR detected (${{ github.event.pull_request.head.repo.full_name }} != ${{ github.repository }}); checking protected paths"
            if git diff --name-only "$MERGE_BASE...HEAD" -- 'tools/lint/**' '.github/workflows/**' | grep -q .; then
              echo "guard: fork PR touches tools/lint/** or .github/workflows/**, which is rejected by policy (same-repo maintainer PR required)"
              git diff --name-only "$MERGE_BASE...HEAD" -- 'tools/lint/**' '.github/workflows/**'
              exit 1
            fi
            echo "protected-paths check passed"
          else
            echo "same-repo PR: protected-paths sub-check (a) exempt"
          fi
      - name: Trusted-lint gate (merge-base tools/lint judges the PR tree)
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags origin "$BASE_SHA" --depth=1 || true
          MERGE_BASE="$(git merge-base HEAD "$BASE_SHA")"
          git checkout "$MERGE_BASE" -- tools/lint
          python tools/lint/deps.py
          python tools/lint/determinism.py
          python -m unittest discover -s tools/lint -p "test_*.py" -v

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Pinned to an exact version on purpose, like the deny job below:
      # a floating pin would change what "default rules" means without a
      # diff here. Default gitleaks rules, no allowlist.
      - uses: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # T096: a pull request that changes only documentation skips the Rust
      # gates below and passes. The job itself always runs and reports: the
      # master-protection ruleset requires both `check` contexts, and a
      # workflow-level path filter would leave them pending for ever.
      # The allowlist is exact: docs/**, tasks/**, Markdown at the repository
      # root, and crates/*/AGENTS.md. Nothing under those paths is compiled or
      # read by a build or test (checked 2026-10-16); a change that makes one
      # of them compiled or read must take it off this list. `--no-renames`
      # lists both sides of a move, so a file moved out of crates/ still counts
      # as code. Pushes to master and the weekly schedule always run every
      # gate. The logic stays inline on purpose: a script in the tree would be
      # judged by the pull request it is judging.
      - name: Classify the change (documentation-only pull requests skip the Rust gates)
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "${{ github.event_name }}: every gate runs"
            exit 0
          fi
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags origin "$BASE_SHA" --depth=1 || true
          MERGE_BASE="$(git merge-base HEAD "$BASE_SHA")"
          CHANGED="$(git diff --name-only --no-renames "$MERGE_BASE...HEAD")"
          CODE="$(printf '%s\n' "$CHANGED" | grep -vE '^(docs|tasks)/|^[^/]+\.md$|^crates/[^/]+/AGENTS\.md$' || true)"
          if [ -n "$CODE" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "every gate runs; first paths outside the documentation allowlist:"
            printf '%s\n' "$CODE" | head -20
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "documentation-only change: fmt, clippy and test skipped. Changed paths:"
            printf '%s\n' "$CHANGED" | head -40
          fi
      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.rust == 'true'
      # T047c (ADR-0033 C4, BR-21): the default-feature graph -- every member,
      # edge kind and target -- holds no godot-family package. The second
      # query is the control: with the engine feature it must find godot, or
      # the first proves nothing. Both only resolve the graph; nothing builds.
      - name: BR-21 (no godot package in the default-feature graph)
        if: steps.scope.outputs.rust == 'true'
        shell: bash
        run: |
          set -euo pipefail
          family='^(godot(-[a-z]+)?|gdextension-api) v'
          graph() {
            cargo tree --workspace --locked -e normal,build,dev --target all \
              --prefix none --format '{p}' "$@"
          }
          default_graph="$(graph)"
          if grep -E "$family" <<<"$default_graph"; then
            echo "BR-21 failed: the default-feature graph holds the godot packages above"
            exit 1
          fi
          engine_graph="$(graph --features crpg-godot/engine)"
          if ! grep -qE '^godot v0\.5\.5([^0-9.]|$)' <<<"$engine_graph"; then
            echo "BR-21 control failed: --features crpg-godot/engine does not resolve godot v0.5.5"
            exit 1
          fi
          echo "BR-21 passed: no godot package by default; the engine control resolves godot v0.5.5"
      - run: cargo fmt --all -- --check
        if: steps.scope.outputs.rust == 'true'
      # `--locked` on both: Cargo.lock is committed, and without this cargo is
      # free to update it in place, so CI could pass against a dependency set
      # that is not the one in the repository. For a project whose thesis is
      # "same binary + same inputs => same result", the tested graph has to be
      # the committed graph.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        if: steps.scope.outputs.rust == 'true'
      - run: cargo test --workspace --locked
        if: steps.scope.outputs.rust == 'true'

  # T047c (ADR-0033 §15 C1-C3): the Windows client build. Windows only
  # (ADR-0012; ADR-0033 platform scope): no Linux job compiles the engine.
  # The job always runs and reports, so the ruleset can require it (C7). Its
  # scope step is a byte-identical copy of the one in `check`; keep them equal.
  # Godot comes from one exact release asset, checked before it is unpacked.
  client:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify the change (documentation-only pull requests skip the client gates)
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "${{ github.event_name }}: every gate runs"
            exit 0
          fi
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          git fetch --no-tags origin "$BASE_SHA" --depth=1 || true
          MERGE_BASE="$(git merge-base HEAD "$BASE_SHA")"
          CHANGED="$(git diff --name-only --no-renames "$MERGE_BASE...HEAD")"
          CODE="$(printf '%s\n' "$CHANGED" | grep -vE '^(docs|tasks)/|^[^/]+\.md$|^crates/[^/]+/AGENTS\.md$' || true)"
          if [ -n "$CODE" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            echo "every gate runs; first paths outside the documentation allowlist:"
            printf '%s\n' "$CODE" | head -20
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "documentation-only change: fmt, clippy and test skipped. Changed paths:"
            printf '%s\n' "$CHANGED" | head -40
          fi
      - uses: Swatinem/rust-cache@v2
        if: steps.scope.outputs.rust == 'true'
      - run: cargo clippy -p crpg-godot --features engine --all-targets --locked -- -D warnings
        if: steps.scope.outputs.rust == 'true'
      - run: cargo build -p crpg-godot --features engine --locked
        if: steps.scope.outputs.rust == 'true'
      - name: Licence notice names exactly the resolved godot packages
        if: steps.scope.outputs.rust == 'true'
        shell: bash
        run: |
          set -euo pipefail
          notice=apps/client/THIRD_PARTY_NOTICES
          family='^(godot(-[a-z]+)?|gdextension-api) v'
          resolved="$(cargo tree -p crpg-godot --features engine --locked -e normal,build \
            --target x86_64-pc-windows-msvc --prefix none --format '{p}' \
            | tr -d '\r' | sed -E 's/ \([^)]*\)$//' | { grep -E "$family" || true; } | sort -u)"
          listed="$(tr -d '\r' < "$notice" | sed -n 's/^  //p' | { grep -E "$family" || true; } | sort -u)"
          if [ "$resolved" != "$listed" ] || [ "$(grep -c . <<<"$resolved")" -ne 8 ]; then
            echo "notice check failed: resolved packages and $notice differ, or are not eight"
            diff <(printf '%s\n' "$resolved") <(printf '%s\n' "$listed") || true
            exit 1
          fi
          echo "notice check passed:"
          printf '%s\n' "$resolved"
      - name: Fetch Godot 4.7.2 and check its digests
        if: steps.scope.outputs.rust == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $url = 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip'
          # SHA-256: ADR-0033 C2 (equals GitHub's asset digest). SHA-512: upstream SHA512-SUMS.txt.
          $pins = [ordered]@{
            SHA256 = '731980f9608d61333e5baf54a2ef17210acc7a538446c0cb9969f002aca1e953'
            SHA512 = '83decd58fdf67b9d657958a1ae6bf1929c20785315a81effe245874cdc57acb709bf868e00778a96984338c1b29dafdb453c6847747694621c6ecf5da2259993'
          }
          $zip = Join-Path $env:RUNNER_TEMP 'Godot_v4.7.2-stable_win64.exe.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'godot-4.7.2'
          Invoke-WebRequest -Uri $url -OutFile $zip
          foreach ($alg in $pins.Keys) {
            $got = (Get-FileHash -Algorithm $alg -LiteralPath $zip).Hash.ToLowerInvariant()
            if ($got -ne $pins[$alg]) { throw "Godot zip $alg $got is not the pinned $($pins[$alg])" }
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $dir -Force
          # The console wrapper finds its engine by name: never rename either exe.
          $exe = Join-Path $dir 'Godot_v4.7.2-stable_win64_console.exe'
          $out = & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "godot --version exited $LASTEXITCODE" }
          $version = "$($out | Select-Object -First 1)".Trim()
          if ($version -ne '4.7.2.stable.official.ed1daf0bf') { throw "unexpected Godot version '$version'" }
          "GODOT=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "Godot $version at $exe"
      - name: Import the client project
        if: steps.scope.outputs.rust == 'true'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          & $env:GODOT --headless --path apps/client --import
          if ($LASTEXITCODE -ne 0) { throw "Import the client project exited $LASTEXITCODE, expected 0" }
          exit 0
      - name: E1 load proof
        if: steps.scope.outputs.rust == 'true'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          & $env:GODOT --headless --path apps/client -s res://tests/load.gd
          if ($LASTEXITCODE -ne 0) { throw "E1 load proof exited $LASTEXITCODE, expected 0" }
          exit 0
      - name: E1 control (missing campaign)
        if: steps.scope.outputs.rust == 'true'
        timeout-minutes: 5
        shell: pwsh
        env:
          CRPG_CAMPAIGN: ${{ runner.temp }}\no-such-campaign
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          & $env:GODOT --headless --path apps/client -s res://tests/load.gd
          if ($LASTEXITCODE -ne 3) { throw "E1 control (missing campaign) exited $LASTEXITCODE, expected 3" }
          exit 0
      - name: BR-22 smoke
        if: steps.scope.outputs.rust == 'true'
        timeout-minutes: 5
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          & $env:GODOT --headless --path apps/client -s res://tests/smoke.gd
          if ($LASTEXITCODE -ne 0) { throw "BR-22 smoke exited $LASTEXITCODE, expected 0" }
          exit 0
      - name: BR-22 control (missing campaign)
        if: steps.scope.outputs.rust == 'true'
        timeout-minutes: 5
        shell: pwsh
        env:
          CRPG_CAMPAIGN: ${{ runner.temp }}\no-such-campaign
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          & $env:GODOT --headless --path apps/client -s res://tests/smoke.gd
          if ($LASTEXITCODE -ne 3) { throw "BR-22 control (missing campaign) exited $LASTEXITCODE, expected 3" }
          exit 0
      - name: Stage the client slice
        if: steps.scope.outputs.rust == 'true'
        shell: bash
        run: |
          set -euo pipefail
          stage=_slice
          rm -rf "$stage"
          mkdir -p "$stage/target/debug"
          cp target/debug/crpg_godot.dll "$stage/target/debug/"
          git ls-files -z -- apps/client campaigns/fixtures/combat_basic LICENSE-MIT LICENSE-APACHE \
            | { grep -zv '/\.[^/]*$' || true; } | xargs -0 cp --parents -t "$stage"
          for f in target/debug/crpg_godot.dll apps/client/project.godot apps/client/crpg.gdextension \
                   apps/client/THIRD_PARTY_NOTICES apps/client/scenes/Main.tscn apps/client/tests/smoke.gd \
                   campaigns/fixtures/combat_basic/campaign.json LICENSE-MIT LICENSE-APACHE; do
            test -f "$stage/$f" || { echo "artifact: $f is missing"; exit 1; }
          done
          if find "$stage" -name '.*' | grep .; then echo "artifact: hidden paths above"; exit 1; fi
          find "$stage" -type f | sort
      - uses: actions/upload-artifact@v7
        if: steps.scope.outputs.rust == 'true'
        with:
          name: crpg-client-slice-windows-x86_64
          path: _slice/
          if-no-files-found: error
          retention-days: 14

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Pinned to an exact version on purpose, unlike the major-tag pins above:
      # deny.toml is written against the cargo-deny 0.20.x config format, and
      # the action is what chooses the cargo-deny version. A floating pin here
      # would break the config, not just change a runner detail.
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
      # T023v: cargo-deny cannot see advisories against a crate replaced by a
      # [patch.crates-io] path (measured, tasks/T023v.md V§1.4), so advisories
      # are checked again on the graph with that table removed. Only this
      # job's throwaway checkout is edited.
      - name: Strip [patch.crates-io] for the advisories re-check
        run: python3 -c "import pathlib; p = pathlib.Path('Cargo.toml'); s = p.read_text(); i = s.index('\n[patch.crates-io]'); p.write_text(s[:i] + '\n')"
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command-arguments: advisories

  lint-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # deps.py needs tomllib, which is 3.11+. Pinning the floor means the
      # lints run on the oldest version they claim to support.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python tools/lint/deps.py

  lint-determinism:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python tools/lint/determinism.py

  # The lints above police the architecture; this job polices them. Without it
  # a lint can be silently defanged and every other job stays green.
  lint-selftest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tools/lint -p "test_*.py" -v
      # Preflight runner tests (T031, decision D26): Bash launcher on Linux,
      # PowerShell launcher on both (pwsh ships on both hosted images). Fake
      # tools only; no real gate runs here.
      - run: python -m unittest discover -s tools/tests -p "test_preflight.py" -v
