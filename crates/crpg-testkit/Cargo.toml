[package]
name = "crpg-testkit"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# Plain testkit -> sim normal dependency: permitted by the ALLOWED table and
# matching the ratified E005 one-way rule (testkit may reach sim; sim never
# reaches testkit, including through dev-dependencies).
crpg-sim = { path = "../crpg-sim" }
# Replay format (T009a): serde + serde_json via the existing workspace
# dependencies. Both are already in the workspace graph (crpg-sim serializes
# through them), so no new package or version enters the lockfile's novel set.
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Tests name EntityId directly (tracked live ids). Same direction, tests only.
crpg-core = { path = "../crpg-core" }
