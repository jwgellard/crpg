[package]
name = "crpg-testkit"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# Plain testkit -> sim normal dependency: permitted by the ALLOWED table and
# matching the ratified E005 one-way rule (testkit may reach sim; sim never
# reaches testkit, including through dev-dependencies).
crpg-sim = { path = "../crpg-sim" }
# Replay format (T009a): serde + serde_json via the existing workspace
# dependencies. Both are already in the workspace graph (crpg-sim serializes
# through them), so no new package or version enters the lockfile's novel set.
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Tests name EntityId directly (tracked live ids). Same direction, tests only.
crpg-core = { path = "../crpg-core" }
# T016c combat adapter (tests only): production content loading through
# crpg-data (load_campaign, SourcePath, Document, validate) and the exact
# trace oracle type from crpg-rules (Outcome). Both are existing workspace
# members; the lock grows by these edge entries only. Approved in-session
# 2026-09-26; ALLOWED already permits testkit -> {anything but crpg-godot}.
crpg-data = { path = "../crpg-data" }
crpg-rules = { path = "../crpg-rules" }
# T037e authored movement suite (tests only): the host under a v4 client over
# real campaign data. crpg-server, crpg-net and crpg-nav are existing
# workspace path crates (T037 Question 1 (a), approved 2026-11-15), so the
# lock grows by these edge entries only and no package is added.
crpg-nav = { path = "../crpg-nav" }
crpg-net = { path = "../crpg-net" }
crpg-server = { path = "../crpg-server" }
# T056b MVP AI behaviour suite (tests only): crpg-ai is the decision under
# test and crpg-nav the mesh the host routes on. Both are existing workspace
# members, so the lock grows by these edge entries only; approved in D62
# (Question 2), and ALLOWED already permits testkit -> {anything but crpg-godot}.
crpg-ai = { path = "../crpg-ai" }
