[package]
name = "crpg-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# T022 (D02/D20): the authoritative host slice is a library; the dedicated
# binary stays a thin wiring shell over it.
[lib]
path = "src/lib.rs"

[[bin]]
name = "crpg-server"
path = "src/main.rs"

[dependencies]
# T022, approved by D20 (tasks/DECISIONS-2026-09-30.md): path edges only, plus
# the workspace serde/serde_json already in Cargo.lock. No crates.io crate is
# added by this crate; see the T018a-style audit in tasks/T022.md.
# T153 (D65f): the MVP AI driver calls `crpg_ai::decide` and maps its decisions
# through the host's own operations. Path edge only; crpg-ai's own edges
# (core, sim, nav) are already dependencies below.
crpg-ai = { path = "../crpg-ai" }
crpg-core = { path = "../crpg-core" }
# T037a (ADR-0036 H1-H5, approved by the user 2026-11-15, T037 Question 1 (a)):
# the navigation mesh, its bake, queries and paths. Path edge only.
crpg-nav = { path = "../crpg-nav" }
crpg-net = { path = "../crpg-net" }
# T023b (ADR-0024, T023 R12): the lane-0 QUIC transport, as a path edge only.
# No direct quinn, quinn-proto, rustls or tokio edge.
crpg-net-quic = { path = "../crpg-net-quic" }
# T039 (H-dep approval in tasks/T039.md): the save envelope and atomic file
# store. Path edge only; zstd and its tree are already locked through T038.
crpg-persist = { path = "../crpg-persist" }
crpg-sim = { path = "../crpg-sim" }
serde = { workspace = true }
serde_json = { workspace = true }
# T025b-q (D68 Question 1 (b)): the session-bound resume proof is a keyed
# BLAKE3 derivation over the invitation credential and the session epoch.
# Workspace edge only; blake3 is already in the workspace and the lock at
# 1.8.7, no package is added.
blake3 = { workspace = true }
# T040b (D70a (b), approved by the user 2026-11-19): Ctrl-C, SIGTERM and
# SIGHUP stop the dedicated server through the same save as `quit`. Exact
# pin; `termination` adds SIGTERM and SIGHUP on Unix. Locks ctrlc and nix
# (Unix) and the Apple-only dispatch2, block2, objc2, objc2-encode;
# windows-sys 0.61.2 is already locked.
ctrlc = { version = "=3.5.2", features = ["termination"] }
# T040b (D70b, approved by the user 2026-11-19): PEM certificate and key
# files through the crate's `pem::PemObject` (default `alloc` feature).
# Already locked at 1.15.1 through the QUIC stack; no package is added.
rustls-pki-types = "1.15.1"
