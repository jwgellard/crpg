[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
indexmap = { version = "2", features = ["serde"] }
# Runtime hash for state_hash (T008a): small transitive set (arrayvec, cc,
# cfg-if, constant_time_eq, cpufeatures per Cargo.lock), crates.io-only, and
# CC0-1.0 OR Apache-2.0 (passes the license gate via the Apache alternative).
blake3 = "1"
# Dev-only deps authorised by ADR-0006. Consumed as dev-dependencies by
# crpg-core (see crates/crpg-core/Cargo.toml); the property tests that use
# them land with T006a.
proptest = "1"
# Promoted to runtime by T008a: state_hash serializes through it.
serde_json = "1"
# Approved by T018a: lane-0 protocol v1 wire codec (crpg-net only).
# License MIT OR Apache-2.0 (permissive, inside deny.toml allow list),
# crates.io-only, no build script, no clock/thread/RNG use in the codec path.
# Default features OFF: postcard's default heapless pulls atomic-polyfill,
# which cargo-deny flags unmaintained (RUSTSEC-2023-0089) against the
# deny.toml `unmaintained = "all"` gate. The codec uses only the always-on
# core (`to_extend`, `take_from_bytes`), so nothing is lost; deny.toml is
# untouched per the T018a rule.
postcard = { version = "1", default-features = false }

[patch.crates-io]
# T023v (user decision 2026-10-05, D23's vendoring mechanism, ADR-0027):
# quinn-proto 0.11.19 from its crates.io archive (sha256
# 0e750cca55fe4f0439a15d0bb529da9651e79993e8e72c61a899a36d462befbe = the
# registry index cksum) plus the reviewed patches in
# third_party/quinn-proto/patches/ (0001: upstream e556fde, CONNECTION_CLOSE
# is not congestion controlled). Re-derivation, evidence and retirement:
# third_party/quinn-proto/VENDOR.md. Not a workspace member; keep this the
# last table (the CI advisories re-check strips it).
quinn-proto = { path = "third_party/quinn-proto/crate" }
